<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 230" role="img" aria-label="OpenHearth">
  <defs>
    <!-- Horizontal rainbow gradient: each line is a full left-to-right rainbow -->
    <linearGradient id="oh-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff5f87"/>
      <stop offset="16%"  stop-color="#ff875f"/>
      <stop offset="33%"  stop-color="#ffaf5f"/>
      <stop offset="50%"  stop-color="#ffd700"/>
      <stop offset="66%"  stop-color="#ffff5f"/>
      <stop offset="74%"  stop-color="#87d700"/>
      <stop offset="82%"  stop-color="#5fd7ff"/>
      <stop offset="90%"  stop-color="#5f87ff"/>
      <stop offset="100%" stop-color="#875fff"/>
    </linearGradient>
    <!-- Softer vertical gradient for the welcome line -->
    <linearGradient id="oh-warm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff5f87"/>
    </linearGradient>
  </defs>
  <!-- Terminal-like background -->
  <rect width="100%" height="100%" rx="16" fill="#0a0f16"/>
  <!-- Subtle grid dots -->
  <g fill="#1e2530">
    <circle cx="60"  cy="70"  r="1.25"/>
    <circle cx="120" cy="70"  r="1.25"/>
    <circle cx="180" cy="70"  r="1.25"/>
    <circle cx="240" cy="70"  r="1.25"/>
    <circle cx="300" cy="70"  r="1.25"/>
    <circle cx="60"  cy="110" r="1.25"/>
    <circle cx="120" cy="110" r="1.25"/>
    <circle cx="180" cy="110" r="1.25"/>
    <circle cx="240" cy="110" r="1.25"/>
    <circle cx="300" cy="110" r="1.25"/>
  </g>
  <!-- ASCII logo -->
  <text xml:space="preserve" x="32" y="52"  font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)">   ____                    _____                _   _</text>
  <text xml:space="preserve" x="32" y="72"  font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)">  / __ \                  |  __ \              | | | |</text>
  <text xml:space="preserve" x="32" y="92"  font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)"> | |  | |_ __   ___ _ __  | |__) |___ _ __ ___ | |_| |</text>
  <text xml:space="preserve" x="32" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)"> | |  | | '_ \ / _ \ '_ \ |  ___/ _ \ '__/ _ \| __| |</text>
  <text xml:space="preserve" x="32" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)"> | |__| | |_) |  __/ | | || |  |  __/ | | (_) | |_| |</text>
  <text xml:space="preserve" x="32" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)">  \____/| .__/ \___|_| |_||_|   \___|_|  \___/ \__|_|</text>
  <text xml:space="preserve" x="32" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)">        | |</text>
  <text xml:space="preserve" x="32" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="url(#oh-rainbow)">        |_|</text>
  <!-- Welcome line -->
  <text xml:space="preserve" x="32" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="url(#oh-warm)">welcome to OpenHearth v2.8.0 · 🔥 Audit the contributions GitHub hides — PRs, issues &amp; reviews beyond the feed.</text>
</svg>
