# OpenHearth — drop-in workflow for any repository (npx CLI)
#
# 1. Copy to: .github/workflows/openhearth-audit.yml
# 2. Or use the Marketplace composite action instead:
#      uses: Ayush7614/OpenHearth@v2.5.1
#    See docs/github-marketplace.md
#
# Uses the published CLI from npm.

name: OpenHearth Audit

on:
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username to audit
        required: true
        type: string
      month:
        description: Month (YYYY-MM). Empty = previous calendar month.
        required: false
        type: string
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve month
        id: meta
        env:
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_USER: ${{ inputs.username }}
        run: |
          USERNAME="${INPUT_USER:-${{ github.repository_owner }}}"
          if [ -n "$INPUT_MONTH" ]; then
            MONTH="$INPUT_MONTH"
          else
            MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run OpenHearth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p audit-out
          npx --yes @felix-ayush/openhearth@2 doctor
          npx --yes @felix-ayush/openhearth@2 audit "${{ steps.meta.outputs.username }}" \
            --month "${{ steps.meta.outputs.month }}" \
            --json "audit-out/audit.json" \
            --csv "audit-out/audit.csv"
          npx --yes @felix-ayush/openhearth@2 hidden "${{ steps.meta.outputs.username }}" \
            --month "${{ steps.meta.outputs.month }}" \
            --json "audit-out/hidden.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openhearth-${{ steps.meta.outputs.username }}-${{ steps.meta.outputs.month }}
          path: audit-out/

      - name: Digest summary
        run: |
          npx --yes @felix-ayush/openhearth@2 digest "audit-out/audit.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post webhook digest (optional)
        if: ${{ env.DIGEST_WEBHOOK_URL != '' }}
        env:
          DIGEST_WEBHOOK_URL: ${{ secrets.DIGEST_WEBHOOK_URL }}
        run: |
          DIGEST="$(npx --yes @felix-ayush/openhearth@2 digest audit-out/audit.json)"
          payload=$(jq -n --arg text "$DIGEST" '{text:$text, content:$text}')
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$DIGEST_WEBHOOK_URL"
