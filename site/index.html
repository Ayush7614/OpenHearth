<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHearth — GitHub Contribution Audit</title>
    <meta
      name="description"
      content="OpenHearth — CLI and browser workspaces to audit GitHub PRs, issues, and reviews — including repos hidden from your activity feed."
    />
    <meta property="og:title" content="OpenHearth — audit what GitHub’s activity feed hides" />
    <meta
      property="og:description"
      content="CLI + browser workspaces for full PR/issue/review audits, hidden-repo ranking, charts, and shareable reports."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ayush7614.github.io/OpenHearth/" />
    <meta property="og:image" content="https://ayush7614.github.io/OpenHearth/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenHearth — GitHub contribution audit" />
    <meta
      name="twitter:description"
      content="Find every PR, issue, and review your profile sidebar truncates."
    />
    <meta name="twitter:image" content="https://ayush7614.github.io/OpenHearth/og.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("openhearth_theme");
          var theme = t === "light" || t === "dark" ? t : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
